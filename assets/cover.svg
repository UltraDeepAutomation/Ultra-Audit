<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Ultra-Audit">
  <defs>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="deep" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <g id="lens">
      <circle cx="0" cy="0" r="42" fill="none" stroke="currentColor" stroke-width="7"/>
      <line x1="30" y1="30" x2="66" y2="66" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="#000000"/>
  <ellipse cx="800" cy="450" rx="520" ry="300" fill="url(#halo)" filter="url(#glow)"/>

  <!-- размытый дальний план -->
  <g color="#7C3AED" opacity="0.5">
    <use href="#lens" transform="translate(214 208) rotate(-24) scale(1.4)" filter="url(#deep)"/>
    <use href="#lens" transform="translate(1402 700) rotate(14) scale(1.56)" filter="url(#deep)"/>
    <use href="#lens" transform="translate(1330 176) rotate(-8) scale(0.88)" filter="url(#soft)"/>
    <use href="#lens" transform="translate(268 712) rotate(32) scale(1.0)" filter="url(#soft)"/>
  </g>

  <!-- резкий передний план -->
  <g color="#A78BFA" opacity="0.72">
    <use href="#lens" transform="translate(452 296) rotate(-16) scale(0.576)"/>
    <use href="#lens" transform="translate(1258 654) rotate(22) scale(0.688)"/>
    <use href="#lens" transform="translate(1216 300) rotate(-34) scale(0.44)"/>
    <use href="#lens" transform="translate(410 620) rotate(8) scale(0.48)"/>
  </g>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="800" y="470" font-size="150" font-weight="700" letter-spacing="-4" fill="#FFFFFF" opacity="0.35" filter="url(#soft)">Ultra-Audit</text>
    <text x="800" y="470" font-size="150" font-weight="700" letter-spacing="-4" fill="#FFFFFF">Ultra-Audit</text>
    <text x="800" y="546" font-size="30" font-weight="500" letter-spacing="6" fill="#B9A9EE">DEEP BUG AUDIT · AUTONOMOUS FIXING</text>
  </g>
</svg>
